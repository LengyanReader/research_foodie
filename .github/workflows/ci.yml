name: ci

on:
  push:
  pull_request:
  # The network job at the bottom is opt-in: a human dispatches it, an ordinary push never pays for it.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Cycle audit (the factory's own definition-of-done, offline)
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        run: python -m harness_factory cycle audit
      - name: Pages + trend-review scaffold build (P69, offline from committed SSOT/snapshot)
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          python -m harness_factory trend --json > /dev/null
          python -m harness_factory pages --json
          python -m harness_factory pages --write
          python -c "import pathlib,re; h=pathlib.Path('../docs/index.html').read_text(encoding='utf-8'); assert h.lstrip().lower().startswith('<!doctype html>'); assert re.search(r'<svg', h); assert 'gbar' in h; assert not re.search(r'(?i)<(script|link|img)[ >]', h), 'page must carry zero external assets/JS'; print('page OK, bytes=', len(h))"
      - name: CLI smoke
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          python -m harness_factory --version
          python -m harness_factory sources --json > /dev/null
          python -m harness_factory evolve --dry-run
          python -m harness_factory self-model --json > /dev/null
      - name: End-to-end emitted harness (init -> check -> gate -> harvest -> doctor)
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/hf-e2e"
          python -m harness_factory init --task "add unit tests to the parser" --out "$OUT"
          python -m harness_factory check --dir "$OUT"
          python -m harness_factory gate --dir "$OUT"
          python -m harness_factory harvest --dir "$OUT" --root "$OUT"
          python -m harness_factory doctor --project "$OUT"
          python -m harness_factory plugins --validate

  network:
    # The network paths are untestable offline by design, so nothing exercised them at all.
    # This job is dispatched by hand, and it never fails the build: it reports reachability.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh from the tracked feeds (collect + score + HEAD-check, write nothing)
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          python -m harness_factory refresh --provider feed --verify --dry-run --max-items 30 --json > refresh.json
          # P67: the feed flow must actually collect - a silent zero across 200+
          # tracked sources means the doors are dead (the P59 feed-health lesson:
          # assert the flow, do not eyeball the log).
          python -c "import json; s=json.load(open('refresh.json')); assert s['collected'] > 0, f'feed flow dead: {s}'; print('feed-flow OK: collected=', s['collected'])"
      - name: Intel from the same feeds
        working-directory: harness_factory
        env:
          PYTHONPATH: src
        run: python -m harness_factory intel
