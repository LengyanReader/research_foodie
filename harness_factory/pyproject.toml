[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-factory"
version = "0.1.0"
description = "Inclusive harness compiler: derive and scaffold the agent harness any task needs."
readme = { text = "Harness Factory — derive and scaffold the agent harness any task needs. See the repository root README.md.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "harness_factory" }]
keywords = ["agents", "harness", "scaffolding", "context-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LengyanReader/research_foodie"
Repository = "https://github.com/LengyanReader/research_foodie"
Changelog = "https://github.com/LengyanReader/research_foodie/blob/main/CHANGELOG.md"

[project.scripts]
harness = "harness_factory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_factory = ["data/*.json", "templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
